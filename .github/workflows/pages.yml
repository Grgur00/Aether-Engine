name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "scripts/check-website-docs.py"
      - "modules/aether-api/src/main/java/**"
      - "modules/aether-codec/src/main/java/io/aetherdb/codec/**"
      - "modules/aether-codec-annotations/src/main/java/**"
      - "modules/aether-embedded-typed/src/main/java/io/aetherdb/embedded/typed/AetherEmbedded.java"
      - "modules/aether-engine/src/main/java/io/aetherdb/engine/**"
      - "gradle.properties"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify developer documentation
        run: python3 scripts/check-website-docs.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
